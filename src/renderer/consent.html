<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Before you start</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="consent-body">

<header class="titlebar">
  <div class="tb-brand">
    <svg class="tb-logo" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3.5" y="3.5" width="12" height="12" rx="3" fill="#7484a0"/>
      <rect x="7" y="7" width="13.5" height="13.5" rx="3.4" fill="var(--bg)"/>
      <rect x="8.5" y="8.5" width="12" height="12" rx="3" fill="#e4a062"/>
    </svg>
    <span data-i18n="app.name"></span>
  </div>
  <div class="tb-center"></div>
  <div class="tb-controls">
    <button id="winClose" class="tb-btn tb-close" data-title="tb.close">
      <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
  </div>
</header>

<div class="consent-scroll">
  <div class="consent-head">
    <h1 data-i18n="consent.title"></h1>
    <p data-i18n="consent.subtitle"></p>
  </div>
  <div id="items"></div>
</div>

<div class="consent-foot">
  <label class="consent-accept" id="acceptWrap">
    <input type="checkbox" class="plain" id="acceptBox">
    <span data-i18n="consent.accept"></span>
  </label>
  <div class="consent-actions">
    <button id="btnDecline" class="btn btn-ghost" data-i18n="consent.decline"></button>
    <button id="btnAgree" class="btn btn-primary" data-i18n="consent.agree" disabled></button>
  </div>
</div>

<script src="consent.js"></script>
</body>
</html>
