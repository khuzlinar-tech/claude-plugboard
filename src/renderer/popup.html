<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Claude Plugboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="popup-body">

<header class="popup-head">
  <svg class="tb-logo" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="3.5" y="3.5" width="12" height="12" rx="3" fill="#7484a0"/>
    <rect x="7" y="7" width="13.5" height="13.5" rx="3.4" fill="var(--bg)"/>
    <rect x="8.5" y="8.5" width="12" height="12" rx="3" fill="#e4a062"/>
  </svg>
  <span class="popup-title" data-i18n="app.name"></span>
  <span class="spacer"></span>
  <button id="pSettings" class="tb-btn tb-tool" data-title="tb.settings">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
      <circle cx="8" cy="8" r="2.3"/>
      <path d="M8 1.6v1.6M8 12.8v1.6M14.4 8h-1.6M3.2 8H1.6M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1M12.5 12.5l-1.1-1.1M4.6 4.6L3.5 3.5"
        stroke-linecap="round"/>
    </svg>
  </button>
  <button id="pClose" class="tb-btn tb-tool" data-title="tb.close">
    <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.3"/></svg>
  </button>
</header>

<div class="popup-scroll" id="popupBody"></div>

<footer class="popup-foot">
  <button id="pOpen" class="btn btn-sm btn-primary" data-i18n="tray.open"></button>
  <button id="pLaunch" class="btn btn-sm" data-i18n="tray.launch"></button>
  <span class="spacer"></span>
  <button id="pQuit" class="btn btn-sm btn-ghost" data-i18n="tray.quit"></button>
</footer>

<script src="popup.js"></script>
</body>
</html>
