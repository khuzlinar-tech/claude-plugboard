name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include e-mail addresses, account UUIDs, or the contents of
        `.credentials.json` in this report.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About
      placeholder: "1.2.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Which Claude Desktop build
      options:
        - Microsoft Store (MSIX)
        - Installer (AnthropicClaude)
        - Both installed
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Profile switching
        - Account details
        - Limits and usage history
        - Claude Code token usage
        - Tray or autostart
        - Settings, theme or translation
        - Something else
    validations:
      required: true

  - type: checkboxes
    id: running
    attributes:
      label: State at the time
      options:
        - label: Claude Desktop was running when the problem happened
        - label: I can reproduce it consistently
